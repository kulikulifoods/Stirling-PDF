# fly.toml app configuration file generated for stirling-pdf on 2025-10-10T17:20:43-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'stirling-pdf'
primary_region = 'sjc'

[build]
  dockerfile = "Dockerfile.fly"

[env]
  SERVER_ADDRESS = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
  grace_period = "60s"
  interval = "15s"
  timeout = "10s"

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 1
